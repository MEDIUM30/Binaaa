<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Você recebeu um presente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Nunito:wght@700;800&display=swap">
<style>
:root{
  --red:#c0182d; --red-deep:#7d0b1c; --cream:#fff4e6; --gold:#ffcf6b;
  --green:#1f9d55; --green-dark:#14753f; --btn-red:#e5253f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:radial-gradient(120% 90% at 50% 35%,var(--red) 0%,var(--red-deep) 100%);
  background-color:var(--red-deep);
  color:var(--cream);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.stage{
  position:relative;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,4.5dvh,40px);padding:20px;text-align:center;
}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;opacity:.0;animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.35}100%{transform:translateY(-115dvh) rotate(25deg);opacity:0}}

h1{
  margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;
  font-size:clamp(30px,9vw,46px);line-height:1.1;letter-spacing:-.01em;max-width:11em;
  text-wrap:balance;
}

/* Presente */
.gift{position:relative;width:min(56vw,220px);aspect-ratio:1/1.05;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35));animation:wiggle 2.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-3deg)}72%{transform:rotate(3deg)}78%{transform:rotate(-2deg)}84%{transform:rotate(0)}}
.box{position:absolute;left:5%;right:5%;bottom:0;height:68%;background:linear-gradient(90deg,#f6b73c,var(--gold) 45%,#f0a92a);border-radius:6px 6px 12px 12px}
.box::after,.lid::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:18%;transform:translateX(-50%);background:linear-gradient(90deg,#b3122a,#e5253f,#b3122a)}
.lid{position:absolute;left:0;right:0;top:12%;height:26%;background:linear-gradient(90deg,#f6b73c,var(--gold) 45%,#f0a92a);border-radius:8px;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .5s .5s;z-index:2}
.bow{position:absolute;left:50%;top:-30%;width:50%;height:42%;transform:translateX(-50%);z-index:3}
.bow i{position:absolute;top:10%;width:50%;height:80%;border:.7em solid #e5253f;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.bow i:first-child{left:-2%;transform:rotate(-28deg)}
.bow i:last-child{right:-2%;transform:rotate(28deg)}
.bow b{position:absolute;left:50%;top:38%;width:22%;height:34%;background:#b3122a;border-radius:50%;transform:translateX(-50%)}
.gift.open{animation:none}
.gift.open .lid,.gift.open .bow{transform:translateY(-150%) rotate(-18deg);opacity:0}
.gift.open .bow{transform:translateX(-50%) translateY(-260%) rotate(18deg)}
.gift.open .box{animation:pop .5s ease-out forwards}
@keyframes pop{50%{transform:scale(1.08)}100%{transform:scale(.92);opacity:0}}

/* Botões */
.actions{display:flex;gap:14px;align-items:center;justify-content:center;min-height:56px}
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:19px;
  min-width:128px;height:56px;padding:0 26px;border-radius:999px;color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 20px rgba(0,0,0,.25);
  transition:transform .12s,box-shadow .12s,left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1);
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.yes{background:var(--green)}
.no{background:var(--btn-red);border:2px solid rgba(255,255,255,.55)}
.no.fly{position:fixed;z-index:20}
.slot{display:inline-block}

/* Revelação */
.reveal{display:none;flex-direction:column;align-items:center;gap:clamp(14px,3dvh,24px);width:100%;max-height:100%}
.reveal.show{display:flex}
.photo{
  margin:0;width:min(78vw,340px);max-height:62dvh;aspect-ratio:3/4;
  background:#fff;padding:10px 10px 10px;border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  transform:rotate(-2deg) scale(.2);opacity:0;
  animation:rise .9s cubic-bezier(.2,1.3,.4,1) forwards;
}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-radius:10px}
@keyframes rise{to{transform:rotate(-2deg) scale(1);opacity:1}}
.caption{
  margin:0;max-width:19em;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;
  font-size:clamp(20px,5.6vw,26px);line-height:1.3;text-wrap:balance;
  opacity:0;animation:fade 1s .7s forwards;
}
@keyframes fade{to{opacity:1}}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:10}
@keyframes fall{to{transform:translateY(110dvh) rotate(360deg)}}

@media (max-height:640px){.gift{width:min(40vw,160px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main class="stage" id="stage">
  <div id="intro" style="display:contents">
    <h1>Você recebeu um presente</h1>
    <div class="gift" id="gift" aria-hidden="true">
      <div class="bow"><i></i><i></i><b></b></div>
      <div class="lid"></div>
      <div class="box"></div>
    </div>
    <div class="actions">
      <button class="btn yes" id="yes" type="button">Abrir</button>
      <span class="slot" id="slot"><button class="btn no" id="no" type="button">Recusar</button></span>
    </div>
  </div>
  <section class="reveal" id="reveal">

<script>
(function(){
  var hearts=document.getElementById('hearts'),sym=['♥','❤','♡'];
  for(var i=0;i<14;i++){
    var s=document.createElement('span');
    s.textContent=sym[i%3];
    s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=(14+Math.random()*22)+'px';
    s.style.color='#ffd1d8';
    s.style.animationDuration=(9+Math.random()*10)+'s';
    s.style.animationDelay=(-Math.random()*14)+'s';
    hearts.appendChild(s);
  }

  var no=document.getElementById('no'),yes=document.getElementById('yes'),slot=document.getElementById('slot');
  function hit(a,b,pad){return !(a.right+pad<b.left||a.left-pad>b.right||a.bottom+pad<b.top||a.top-pad>b.bottom)}
  function dodge(e){
    if(e){e.preventDefault();}
    if(!no.classList.contains('fly')){
      var r=no.getBoundingClientRect();
      slot.style.width=r.width+'px';slot.style.height=r.height+'px';
      no.classList.add('fly');
      no.style.left=r.left+'px';no.style.top=r.top+'px';
    }
    var w=no.offsetWidth,h=no.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top=parseInt(getComputedStyle(document.documentElement).paddingTop)||0;
    var yr=yes.getBoundingClientRect(),cur=no.getBoundingClientRect(),x,y,tries=0;
    do{
      x=m+Math.random()*(vw-w-2*m);
      y=m+top+Math.random()*(vh-h-2*m-top-10);
      var box={left:x,top:y,right:x+w,bottom:y+h};
      tries++;
    }while(tries<40&&(hit(box,yr,12)||Math.hypot(x-cur.left,y-cur.top)<90));
    no.style.left=x+'px';no.style.top=y+'px';
  }
  no.addEventListener('click',dodge);

  yes.addEventListener('click',function(){
    yes.disabled=true;no.disabled=true;
    document.getElementById('gift').classList.add('open');
    setTimeout(function(){
      document.getElementById('intro').style.display='none';
      no.classList.remove('fly');
      document.getElementById('reveal').classList.add('show');
      var c=['❤️','💖','✨','🌸','💗'];
      for(var i=0;i<26;i++){
        var f=document.createElement('span');
        f.className='confetti';f.textContent=c[i%c.length];
        f.style.left=(Math.random()*100)+'vw';
        f.style.animationDuration=(3+Math.random()*3)+'s';
        f.style.animationDelay=(Math.random()*1.5)+'s';
        document.body.appendChild(f);
        setTimeout((function(el){return function(){el.remove()}})(f),8000);
      }
    },1100);
  });
})();
</script>
